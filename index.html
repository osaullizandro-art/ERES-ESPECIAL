<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mensaje para Josefina Aquino</title>
<style>
body{margin:0;background:#000;color:#0f0;font-family:monospace;overflow:hidden}
#matrix{position:fixed;inset:0;opacity:.2}
#terminal{position:relative;padding:20px;z-index:2}
#bar{width:100%;height:20px;background:#222}
#fill{height:100%;width:0;background:#0f0}
.heart{position:fixed;color:red;animation:up 5s linear infinite}
@keyframes up{from{transform:translateY(100vh)}to{transform:translateY(-10vh)}}
</style>
</head>
<body>
<canvas id="matrix"></canvas>
<div id="terminal">
<h2>Inicializando...</h2>
<div id="bar"><div id="fill"></div></div>
<pre id="out"></pre>
<h1 style="display:none" id="msg">❤️ Josefina Aquino, eres una persona muy especial. ❤️</h1>
</div>
<script>
let p=0,f=document.getElementById('fill');
let t=setInterval(()=>{
p++;
f.style.width=p+'%';
if(p>=100){
clearInterval(t);
document.getElementById('out').textContent='Sistema cargado correctamente.';
document.getElementById('msg').style.display='block';
for(let i=0;i<80;i++){
let h=document.createElement('div');
h.className='heart';
h.textContent='❤';
h.style.left=Math.random()*100+'vw';
h.style.animationDelay=Math.random()*5+'s';
document.body.appendChild(h);
}
if(window.confetti){
confetti();
}
}
},40);
</script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
</body></html>
