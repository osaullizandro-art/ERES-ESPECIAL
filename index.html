<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acceso Confidencial</title>

<style>
body{
margin:0;
background:#000;
color:#00ff88;
font-family:Consolas,monospace;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
overflow:hidden;
}

#terminal{
width:90%;
max-width:800px;
background:#111;
padding:25px;
border-radius:12px;
box-shadow:0 0 20px #00ff88;
white-space:pre-wrap;
line-height:1.6;
}

button{
display:none;
margin-top:20px;
padding:15px 30px;
background:#00ff88;
border:none;
border-radius:8px;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

#mensaje{
display:none;
margin-top:20px;
background:#1b1b1b;
padding:20px;
border-radius:10px;
color:white;
animation:fade .8s;
}

@keyframes fade{
from{opacity:0;transform:translateY(20px);}
to{opacity:1;transform:translateY(0);}
}
</style>

</head>

<body>

<div id="terminal"></div>

<script>

const lineas=[
"OGANDO SYSTEMS v1.0",
"",
"> Inicializando sistema...",
"> Cargando módulos...",
"",
"[████████████████████] 100%",
"",
"> Conectando...",
"✔ Conexión establecida",
"",
"> Buscando personas extraordinarias...",
"",
"✔ Persona encontrada",
"",
"Nombre: Josefina Aquino ❤️",
"",
"> Analizando...",
"",
"✔ Inteligencia .......... 100%",
"✔ Bondad ................. 100%",
"✔ Dedicación ............. 100%",
"✔ Paciencia .............. 100%",
"✔ Carisma ............... 100%",
"",
"> Generando informe...",
"",
"✔ Informe listo."
];

let i=0;

function escribir(){

if(i<lineas.length){

document.getElementById("terminal").innerHTML+=lineas[i]+"<br>";

i++;

setTimeout(escribir,400);

}else{

document.getElementById("terminal").innerHTML+=`
<br>
<button id="btn" onclick="mostrar()">❤️ Abrir informe confidencial</button>

<div id="mensaje">

<h2>Josefina Aquino ❤️</h2>

<p>

Después de ejecutar miles de algoritmos y analizar millones de posibilidades...

el resultado siempre fue el mismo.

<br><br>

<b>Eres una gran persona.</b>

<br><br>

No solo admiro la excelente informática que eres.

Admiro aún más tu forma de ser, tu inteligencia, tu dedicación y la calidad humana que tienes.

<br><br>

Gracias por llegar a mi vida.

Conocerte ha sido uno de esos regalos inesperados que hacen los días mucho más especiales.

<br><br>

Espero que nunca cambies esa esencia tan bonita que te caracteriza.

<br><br>

<b>Gracias por existir. ❤️</b>

<br><br>

— Saul

</p>

</div>
`;

document.getElementById("btn").style.display="inline-block";

}

}

escribir();

function mostrar(){

document.getElementById("mensaje").style.display="block";

for(let i=0;i<80;i++){

let c=document.createElement("div");

c.style.position="fixed";
c.style.left=Math.random()*100+"vw";
c.style.top="-10px";
c.style.width="8px";
c.style.height="8px";
c.style.background=`hsl(${Math.random()*360},100%,50%)`;
c.style.borderRadius="50%";
c.style.transition="4s";
document.body.appendChild(c);

setTimeout(()=>{
c.style.transform=`translateY(${window.innerHeight+100}px)`;
c.style.opacity=0;
},10);

setTimeout(()=>c.remove(),4000);

}

}

</script>

</body>
</html>
